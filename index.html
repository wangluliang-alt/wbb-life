<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf6ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="WBB Life"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>WBB Life · 王比比生活</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29362f;background:var(--app-background,#faf6ee)}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93b9a5}button{border:0}.shell{max-width:720px;margin:auto;padding:25px 19px 105px}.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:700;color:#879487;text-transform:uppercase}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-family:inherit;font-size:37px;font-weight:500;margin:8px 0 4px}h2{font-family:inherit;font-size:27px;font-weight:500;margin:10px 0}p{color:#7e887f;line-height:1.55}.sub{margin:0 0 24px}.pill{padding:11px 17px;border-radius:40px;background:#e7eee5;color:#355844;font-weight:700}.primary{background:var(--app-accent,#365f4f);color:white;border-radius:16px;padding:13px 19px;font-weight:700}.secondary{background:#e9ede4;color:#365444;border-radius:14px;padding:11px 15px}.card{background:#fff;border:1px solid #e9e8df;border-radius:23px;padding:19px;box-shadow:0 8px 25px #354b3510;margin-bottom:13px}.hero{background:linear-gradient(120deg,#e6ede1,#f6e7dd);padding:24px;position:relative;overflow:hidden}.hero strong{font-family:inherit;font-size:27px;font-weight:500}.hero .flower{position:absolute;right:16px;top:13px;font-size:63px;opacity:.75}.muted{color:#889088;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.track{width:100%;text-align:left;display:flex;gap:13px;align-items:center;background:#fff;border:1px solid #e9e8df;border-radius:20px;padding:15px;margin:9px 0}.icon{width:47px;height:47px;border-radius:16px;background:#f1f2e9;display:grid;place-items:center;font-size:24px;flex:none}.grow{flex:1;min-width:0}.track strong{display:block;font-size:16px}.track small{display:block;color:#8b938b;margin-top:4px}.value{color:#3c6652;font-weight:800;font-size:14px}.section{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.section h2{margin:0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffefcf0;backdrop-filter:blur(15px);border-top:1px solid #e8e8e0;display:flex;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:4}.bottom button{width:105px;background:transparent;color:#89938b;padding:5px;font-size:12px}.bottom button span{display:block;font-size:21px;margin-bottom:4px}.bottom button.active{color:#315e4c;font-weight:800}.back{background:transparent;color:#3e6654;padding:9px 0;font-weight:700}.calendarHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.calendarHead button{background:#eef1ea;border-radius:12px;width:38px;height:38px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dayname{text-align:center;font-size:12px;color:#919b92;padding:4px}.day{min-height:55px;border-radius:13px;background:#f6f7f3;color:#314436;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:7px 1px;font-size:13px}.day.selected{background:#3a6652;color:white}.day.has:not(.selected){background:#e1ecdf}.day small{font-size:9px;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.day.empty{background:transparent}.field{display:block;margin:15px 0;color:#465849;font-size:13px;font-weight:700}.field input,.field select,.field textarea{display:block;width:100%;padding:14px;border:1px solid #dce3dc;border-radius:14px;background:#fff;color:#283d30;margin-top:8px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.choice{display:flex;gap:8px}.choice button{flex:1;padding:14px;border-radius:13px;background:#edf0e9;color:#42604d}.choice .chosen{background:var(--app-accent,#365f4f);color:white}.counter{display:flex;justify-content:center;align-items:center;gap:30px;padding:12px}.counter strong{font-family:inherit;font-size:49px;font-weight:400}.counter button{width:50px;height:50px;border-radius:50%;background:#e2eee5;font-size:26px;color:#355a46}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#243d32;color:white;padding:12px 18px;border-radius:13px;z-index:8}.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px}.bar{flex:1;min-width:0;border-radius:6px 6px 0 0;background:#9ac3a5}.bar.zero{background:#eef1ea;height:4px!important}.barlabel{font-size:10px;color:#849186}.navline{color:#839084;font-size:13px}.empty-state{text-align:center;padding:35px 10px}.empty-state .icon{margin:auto}.danger{background:#fbeae5;color:#ab5347;border-radius:12px;padding:12px}.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.type-grid button{padding:15px;border-radius:14px;background:#f2f3ed;text-align:left;color:#38503d}.type-grid button.chosen{background:#dcece0;box-shadow:inset 0 0 0 2px #5c9876}.type-grid small{display:block;margin-top:5px;color:#75857b}.dateTitle{font-weight:700;color:#496553;margin:17px 0 6px}.entry{background:#f3f6f1;padding:11px;border-radius:12px;display:flex;justify-content:space-between;margin:7px 0;gap:8px}.entry button{background:transparent;color:#b45b4d}.settingsActions{display:flex;gap:9px;flex-wrap:wrap}.settingsActions button{flex:1}.hide{display:none!important}@media(min-width:630px){.grid-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.track{margin:0}.shell{padding-top:38px}}@media(max-width:390px){h1{font-size:32px}.shell{padding-left:14px;padding-right:14px}.day{min-height:48px}}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:15px 0}.swatch{aspect-ratio:1;border-radius:17px;border:3px solid white;box-shadow:0 0 0 1px #d6dcd3}.swatch.selected{outline:3px solid #375b49;outline-offset:2px}.swatch.selected:after{content:'✓';font-size:20px;font-weight:bold}.color-row{margin:23px 0}.color-row h3{font-size:15px;margin-bottom:5px}h1,h2,.hero strong,.counter strong{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:-.035em}
/* WBB Life weekly dashboard */
:root{color:#171b30}body{background:var(--app-background,#faf6ee)}.shell{padding-top:22px}.brand-title{font-size:34px;font-weight:750;letter-spacing:-.045em;margin:0}.brand-sub{font-size:13px;margin:0;color:#555b70}.top-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.top-brand button{background:transparent;font-size:23px;color:#202337;padding:9px}.week-card,.day-overview,.category-box,.recent-box{border-radius:22px;background:#ffffffb5;box-shadow:0 4px 18px #bf8d9b0e;margin-bottom:13px;padding:15px}.week-controls{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:14px}.week-controls button{background:transparent;font-size:28px;padding:0 9px;color:#202337}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.week-cell{background:transparent;display:flex;flex-direction:column;align-items:center;gap:8px;padding:5px 0;color:#202337;min-width:0}.week-cell small{font-size:11px;color:#798093}.week-cell strong{font-size:17px;font-weight:500;width:35px;height:35px;display:grid;place-items:center;border-radius:50%}.week-cell.selected strong{background:var(--app-accent,#bd6881);color:#fff}.week-dot{width:6px;height:6px;border-radius:50%;background:#b6c4be}.week-cell.has-record .week-dot{background:var(--app-accent,#bd6881)}.day-overview .overview-head{display:flex;align-items:center;justify-content:space-between;font-weight:750;font-size:17px}.overview-head button{background:#f9dce8;color:#b22660;border-radius:30px;padding:9px 16px;font-size:13px}.overview-sub{margin:7px 0;color:#4b5064}.progress-rail{height:10px;border-radius:30px;background:#f5e3e9;overflow:hidden}.progress-fill{height:100%;background:var(--app-accent,#bd6881);border-radius:30px}.category-box{padding:0;overflow:hidden}.category-header{width:100%;padding:17px 16px;text-align:left;display:flex;align-items:center;gap:10px;background:#f7e4ec;color:#1d2032}.category-box:nth-of-type(3n + 1) .category-header{background:#e4f1e3}.category-box:nth-of-type(3n + 2) .category-header{background:#e1eefa}.category-header strong{font-size:19px;flex:1}.category-header span{font-size:13px}.category-header .chevron{font-size:21px}.category-rows{padding:7px}.tracker-line{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border-radius:14px;padding:14px 12px;margin-bottom:5px;color:#22263a}.tracker-line .tracker-name{font-size:15px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tracker-line .tracker-value{font-size:14px;color:#a52c65;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tracker-line .tracker-value.missing{color:#8b90a1;font-size:12px}.tracker-line .tracker-go{font-size:22px;color:#bd477a}.category-empty{padding:15px;color:#7e8290;font-size:13px}.add-tracker-wide{width:100%;padding:16px;background:#f7dce7;border-radius:30px;color:#a92360;font-weight:700;font-size:16px;margin:4px 0 17px}.recent-box h2{font-size:20px;font-weight:700}.recent-line{display:flex;align-items:center;gap:10px;padding:12px 3px;border-bottom:1px solid #f4eff1;font-size:13px}.recent-line strong{flex:1}.recent-line span{color:#a52c65}.manage-categories{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.manage-categories button{background:transparent;color:#9b4a70;font-size:13px}.category-manage-row{display:flex;align-items:center;gap:7px;padding:11px;border-bottom:1px solid #eee}.category-manage-row strong{flex:1}.category-manage-row button{background:#f3eef0;padding:8px;border-radius:9px}.category-select{margin-top:8px}.bottom button.active{color:var(--app-accent,#365f4f)}.track .icon{display:none}@media(min-width:630px){.category-box{margin-bottom:12px}}</style></head><body><div id="app" class="shell"></div><nav id="nav" class="bottom"></nav><script>
const KEY='wbb-life-v1';
const TYPES={bool:['✅','Yes / No','A simple daily check-in'],number:['⚖️','Number','Measurements like weight'],counter:['🔢','Counter','Tap +1 whenever it happens'],duration:['⏱️','Duration','Minutes or hours per day'],interval:['🌙','Time range','Start and end; multiple per day'],journal:['📝','Journal','Daily written notes']};
const starter=[['Weight','number','⚖️','kg'],['Reading','bool','📚',''],['Exercise','duration','🏃','min'],['Water','counter','💧','times'],['Sleep','interval','🌙','']];
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const today=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const initial=()=>({items:starter.map(x=>({id:uid(),name:x[0],type:x[1],emoji:x[2],unit:x[3]})),records:{}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(db.items)||!db.records)throw Error()}catch{db=initial()}
const COLORSETS={background:['#faf6ee','#f7eaf1','#eaf4f0','#edf0fb','#fff2dc','#f1eaff','#e9f2fa','#f5efe8','#f1f4df','#f7e8e3'],accent:['#365f4f','#9c5678','#426f91','#8063a3','#ad6d3e','#51766b','#80654a','#bd6881','#657b3f','#5363a0']};let colors;try{colors=JSON.parse(localStorage.getItem('wbb-life-colors'))||{}}catch{colors={}};function applyColors(){let bg=COLORSETS.background.includes(colors.background)?colors.background:'#faf6ee',ac=COLORSETS.accent.includes(colors.accent)?colors.accent:'#365f4f';document.documentElement.style.background=bg;document.documentElement.style.setProperty('--app-background',bg);document.documentElement.style.setProperty('--app-accent',ac);document.querySelector('meta[name="theme-color"]').content=bg}function chooseColor(key,color){colors[key]=color;localStorage.setItem('wbb-life-colors',JSON.stringify(colors));applyColors();render()}let page='home',current=null,date=today(),month=new Date().getMonth(),year=new Date().getFullYear(),editing=null;
const el=document.getElementById('app'),nav=document.getElementById('nav');
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const CAT_KEY='wbb-life-category-ui-v1';
const defaultCategories=['Health','Learning','Lifestyle','Personal'];
if(!Array.isArray(db.categories)){db.categories=defaultCategories.map(name=>({id:uid(),name}));}
if(!db.categories.length)db.categories=[{id:uid(),name:'General'}];
function inferCategory(it){let n=it.name.toLowerCase();let category=/weight|sleep|exercise|health|walk|medic|blood/.test(n)?'Health':/read|learn|study|calculus|music|course/.test(n)?'Learning':/water|food|clean|home/.test(n)?'Lifestyle':'Personal';return db.categories.find(c=>c.name===category)?.id||db.categories[0].id}
db.items.forEach(it=>{if(!db.categories.some(c=>c.id===it.categoryId))it.categoryId=inferCategory(it)});
save();
let homeDate=today(),collapsed={};try{collapsed=JSON.parse(localStorage.getItem(CAT_KEY))||{}}catch{collapsed={}}
function categoryOptions(selected){return db.categories.map(c=>'<option value="'+escapeHtml(c.id)+'" '+(c.id===selected?'selected':'')+'>'+escapeHtml(c.name)+'</option>').join('')}
function toggleCategory(id){collapsed[id]=!collapsed[id];localStorage.setItem(CAT_KEY,JSON.stringify(collapsed));render()}
function categoryManage(){return '<button class="back" onclick="show(\'home\')">← Back</button>'+head('Categories','Create, rename and reorder your sections.')+'<div class="card">'+db.categories.map((c,i)=>'<div class="category-manage-row"><strong>'+escapeHtml(c.name)+'</strong><button onclick="moveCategory(\''+c.id+'\',-1)" aria-label="Move up">↑</button><button onclick="moveCategory(\''+c.id+'\',1)" aria-label="Move down">↓</button><button onclick="renameCategory(\''+c.id+'\')">Edit</button><button onclick="removeCategory(\''+c.id+'\')">×</button></div>').join('')+'<button class="primary" style="margin-top:17px" onclick="addCategory()">+ Add category</button></div>'}
function addCategory(){let name=prompt('New category name');if(!name?.trim())return;db.categories.push({id:uid(),name:name.trim().slice(0,45)});save();render()}
function renameCategory(id){let c=db.categories.find(c=>c.id===id);if(!c)return;let name=prompt('Category name',c.name);if(!name?.trim())return;c.name=name.trim().slice(0,45);save();render()}
function moveCategory(id,n){let i=db.categories.findIndex(c=>c.id===id),j=i+n;if(i<0||j<0||j>=db.categories.length)return;[db.categories[i],db.categories[j]]=[db.categories[j],db.categories[i]];save();render()}
function removeCategory(id){if(db.categories.length===1)return alert('Keep at least one category.');let c=db.categories.find(x=>x.id===id);if(!confirm('Delete category "'+c.name+'"? Its trackers and records will be kept and moved to another category.'))return;db.categories=db.categories.filter(x=>x.id!==id);db.items.filter(x=>x.categoryId===id).forEach(x=>x.categoryId=db.categories[0].id);save();render()}
function startOfWeek(d){let a=new Date(d+'T12:00:00');a.setDate(a.getDate()-a.getDay());return a}
function shiftWeek(n){let d=startOfWeek(homeDate);d.setDate(d.getDate()+n*7);homeDate=iso(d);render()}
function pickHomeDate(d){homeDate=d;render()}
function openHomeTracker(id){current=id;date=homeDate;let dt=new Date(date+'T12:00:00');month=dt.getMonth();year=dt.getFullYear();page='detail';render();window.scrollTo(0,0)}
function homeWeek(){let start=startOfWeek(homeDate),label=new Date(homeDate+'T12:00:00').toLocaleDateString('en-SG',{month:'long',year:'numeric'});let cells=Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);let key=iso(d),has=db.items.some(it=>rec(it.id,key)!=null);return '<button class="week-cell '+(key===homeDate?'selected ':'')+(has?'has-record':'')+'" onclick="pickHomeDate(\''+key+'\')"><small>'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]+'</small><strong>'+d.getDate()+'</strong><i class="week-dot"></i></button>'}).join('');return '<div class="week-card"><div class="week-controls"><button onclick="shiftWeek(-1)">‹</button><span>'+label+'</span><button onclick="shiftWeek(1)">›</button></div><div class="week-grid">'+cells+'</div></div>'}
function dashboard(){let n=db.items.filter(it=>rec(it.id,homeDate)!=null).length,dt=new Date(homeDate+'T12:00:00'),dateLabel=dt.toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short',year:'numeric'}),pct=db.items.length?Math.round(100*n/db.items.length):0;let h='<div class="top-brand"><div><h1 class="brand-title">WBB Life</h1><p class="brand-sub">王比比生活</p></div><button onclick="show(\'settings\')" aria-label="Settings">⚙</button></div>'+homeWeek()+'<div class="day-overview"><div class="overview-head"><span>'+dateLabel+'</span><button onclick="pickHomeDate(\''+today()+'\')">Today</button></div><div class="overview-sub">'+n+' / '+db.items.length+' recorded</div><div class="progress-rail"><div class="progress-fill" style="width:'+pct+'%"></div></div></div><div class="manage-categories"><strong>My life</strong><button onclick="show(\'categories\')">Manage categories ⚙</button></div>';
for(let c of db.categories){let its=db.items.filter(it=>it.categoryId===c.id),done=its.filter(it=>rec(it.id,homeDate)!=null).length,isClosed=!!collapsed[c.id];h+='<div class="category-box"><button class="category-header" onclick="toggleCategory(\''+c.id+'\')"><strong>'+escapeHtml(c.name)+'</strong><span>'+done+' / '+its.length+'</span><span class="chevron">'+(isClosed?'⌄':'⌃')+'</span></button>';if(!isClosed){h+='<div class="category-rows">'+(its.length?its.map(it=>{let v=rec(it.id,homeDate),missing=v==null||v===''||Array.isArray(v)&&!v.length;return '<button class="tracker-line" onclick="openHomeTracker(\''+it.id+'\')"><span class="tracker-name">'+escapeHtml(it.name)+'</span><span class="tracker-value '+(missing?'missing':'')+'">'+escapeHtml(summary(it,homeDate))+'</span><span class="tracker-go">'+(missing?'＋':'›')+'</span></button>'}).join(''):'<div class="category-empty">No trackers in this category yet.</div>')+'</div>'}h+='</div>'}
h+='<button class="add-tracker-wide" onclick="show(\'new\')">＋ Add Tracker</button>';let recent=[];for(let it of db.items)for(let [d,v] of Object.entries(db.records[it.id]||{}))if(v!=null)recent.push({it,d});recent.sort((a,b)=>b.d.localeCompare(a.d));h+='<div class="recent-box"><h2>Recent Records</h2>'+(recent.slice(0,5).map(x=>'<div class="recent-line"><strong>'+escapeHtml(x.it.name)+'</strong><span>'+escapeHtml(summary(x.it,x.d))+'</span><small>'+escapeHtml(x.d)+'</small></div>').join('')||'<p>No records yet.</p>')+'</div>';return h}

const item=id=>db.items.find(x=>x.id===id);
const rec=(id,d)=>db.records[id]?.[d];
const setrec=(id,d,v)=>{if(!db.records[id])db.records[id]={};if(v===null||v===''||Array.isArray(v)&&!v.length)delete db.records[id][d];else db.records[id][d]=v;save();render()};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const head=(title,sub)=>'<div class="eyebrow">WBB LIFE · 王比比生活</div><h1>'+title+'</h1><p class="sub">'+sub+'</p>';
function summary(it,d=today()){let v=rec(it.id,d);if(v==null||v===''||Array.isArray(v)&&!v.length)return 'Not recorded';if(it.type==='bool')return v?'✓ Done':'Not yet';if(it.type==='interval'){let m=v.reduce((s,x)=>s+minutes(x.start,x.end),0);return fmt(m)}if(it.type==='duration')return fmt(+v);if(it.type==='journal')return String(v).slice(0,28)+(String(v).length>28?'…':'');return v+(it.unit?' '+it.unit:'')}
const fmt=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+(m%60?m%60+'m':''):m+'m'};
function minutes(a,b){if(!a||!b)return 0;let p=a.split(':').map(Number),q=b.split(':').map(Number),n=q[0]*60+q[1]-p[0]*60-p[1];return n<0?n+1440:n}
function show(pageName,id){page=pageName;if(id)current=id;if(pageName!=='detail'){date=today();month=new Date().getMonth();year=new Date().getFullYear()}render();window.scrollTo(0,0)}
function navigation(){nav.innerHTML=[['home','⌂','Today'],['all','▦','Trackers'],['settings','⚙','Settings']].map(([k,ic,s])=>'<button class="'+(page===k?'active':'')+'" onclick="show(\''+k+'\')"><span>'+ic+'</span>'+s+'</button>').join('')}
function tiles(){return '<div class="grid-cards">'+db.items.map(it=>'<button class="track" onclick="show(\'detail\',\''+it.id+'\')"><span class="icon">'+escapeHtml(it.emoji)+'</span><span class="grow"><strong>'+escapeHtml(it.name)+'</strong><small>'+(KINDS[kindOf(it)]?.[1]||TYPES[it.type][1])+'</small></span><span class="value">'+escapeHtml(summary(it))+' ›</span></button>').join('')+'</div>'}
function legacyHome(){let n=db.items.filter(x=>rec(x.id,today())!=null).length;return head('A little life, every day.','Your personal space to notice the little things. 🌿')+'<div class="card hero"><div class="flower">🌼</div><div class="eyebrow">TODAY · '+new Date().toLocaleDateString('en-SG',{weekday:'long',month:'long',day:'numeric'})+'</div><p style="margin:17px 0 5px"><strong>Make today yours.</strong></p><div class="muted">'+n+' of '+db.items.length+' trackers recorded today</div></div><div class="section"><h2>Your trackers</h2><button class="pill" onclick="show(\'new\')">+ Add</button></div>'+tiles()+(db.items.length?'':'<div class="card empty-state">Create your first tracker 🌸</div>')}
function home(){return dashboard()}
function all(){return head('Your little collection','Everything you choose to keep track of, in one place.')+'<div class="section"><h2>All trackers</h2><button class="pill" onclick="show(\'new\')">+ New</button></div>'+tiles()}
function calendar(it){let offset=(new Date(year,month,1).getDay()+6)%7,max=new Date(year,month+1,0).getDate();let s='<div class="calendarHead"><button onclick="shift(-1)">‹</button><strong>'+new Date(year,month).toLocaleDateString('en-SG',{month:'long',year:'numeric'})+'</strong><button onclick="shift(1)">›</button></div><div class="calendar">'+['M','T','W','T','F','S','S'].map(x=>'<div class="dayname">'+x+'</div>').join('');for(let i=0;i<offset;i++)s+='<div class="day empty"></div>';for(let i=1;i<=max;i++){let d=iso(new Date(year,month,i)),v=rec(it.id,d);s+='<button class="day '+(d===date?'selected ': '')+(v!=null?'has':'')+'" onclick="choose(\''+d+'\')">'+i+(v!=null?'<small>'+escapeHtml(it.type==='bool'?(v?'✓':'—'):it.type==='interval'?fmt(v.reduce((a,x)=>a+minutes(x.start,x.end),0)):it.type==='duration'?fmt(v):v)+'</small>':'')+'</button>'}return s+'</div>'}
function detail(){let it=item(current);if(!it){show('home');return ''}let v=rec(it.id,date),form='';
if(it.type==='bool')form='<div class="choice"><button class="'+(v===true?'chosen':'')+'" onclick="setrec(\''+it.id+'\',date,true)">✓ Yes, done!</button><button class="'+(v===false?'chosen':'')+'" onclick="setrec(\''+it.id+'\',date,false)">Not today</button></div>';
if(it.type==='number')form='<label class="field">Value '+escapeHtml(it.unit||'')+'<input id="val" type="number" step="any" inputmode="decimal" value="'+escapeHtml(v??'')+'" placeholder="Enter a number"></label><button class="primary" onclick="writeNumber()">Save entry</button>';
if(it.type==='counter')form='<div class="counter"><button onclick="changeCount(-1)">−</button><strong>'+Number(v||0)+'</strong><button onclick="changeCount(1)">+</button></div><p style="text-align:center">Each tap adds one '+escapeHtml(it.unit||'count')+'.</p>';
if(it.type==='duration')form='<label class="field">Minutes<input id="val" type="number" step="1" min="0" inputmode="numeric" value="'+escapeHtml(v??'')+'" placeholder="e.g. 20"></label><button class="primary" onclick="writeNumber()">Save duration</button>';
if(it.type==='journal')form='<label class="field">Your note<textarea id="note" rows="6" maxlength="5000">'+escapeHtml(v||'')+'</textarea></label><button class="primary" onclick="saveNote()">Save note</button>';
if(it.type==='interval'){form='<p class="muted">Add each sleep session, including naps. Overnight time ranges are supported.</p>'+(Array.isArray(v)?v:[]).map((x,i)=>'<div class="entry"><span>'+escapeHtml(x.start)+' → '+escapeHtml(x.end)+' · '+fmt(minutes(x.start,x.end))+'</span><button onclick="removeInterval('+i+')">Remove</button></div>').join('')+'<div class="row"><label class="field">From<input type="time" id="from" value="23:00"></label><label class="field">To<input type="time" id="to" value="07:00"></label></div><button class="primary" onclick="addInterval()">+ Add time range</button>'}
let goalInfo='';if(it.kind==='progress'){let total=Object.values(db.records[it.id]||{}).reduce((sum,x)=>sum+(Number(x)||0),0);goalInfo='<div class="card"><strong>Overall progress: '+total+' '+escapeHtml(it.unit||'')+(it.goal?' / '+escapeHtml(it.goal):'')+'</strong></div>'}else if(it.kind==='target'&&it.goal){let entries=db.records[it.id]||{},todayValue=Number(entries[date])||0,weekValue=Object.entries(entries).filter(([d])=>{let a=new Date(d+'T12:00:00'),b=new Date(date+'T12:00:00');let diff=Math.round((b-a)/86400000),dow=(b.getDay()+6)%7;return diff>=0&&diff<=dow}).reduce((sum,[d,v])=>sum+(Number(v)||0),0);let progress=it.period==='week'?weekValue:it.period==='total'?Object.values(entries).reduce((sum,v)=>sum+(Number(v)||0),0):todayValue;goalInfo='<div class="card"><strong>Goal: '+progress+' / '+escapeHtml(it.goal)+' '+escapeHtml(it.unit||'')+' ('+escapeHtml(it.period||'day')+')</strong></div>'};return '<button class="back" onclick="show(\'home\')">← Back to today</button><div class="heading"><div><div class="eyebrow">'+TYPES[it.type][1]+'</div><h1>'+(it.emoji?escapeHtml(it.emoji)+' ':'')+escapeHtml(it.name)+'</h1></div><button class="secondary" onclick="show(\'edit\',\''+it.id+'\')">Edit / Delete</button></div><p class="sub">Your records, one day at a time.</p>'+goalInfo+'<div class="card">'+calendar(it)+'</div><div class="card"><div class="dateTitle">'+new Date(date+'T12:00:00').toLocaleDateString('en-SG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div><h2>'+escapeHtml(summary(it,date))+'</h2>'+form+(v!=null?'<div style="margin-top:18px"><button class="secondary" onclick="clearEntry()">Clear this day</button></div>':'')+'</div>'+graph(it)}
function shift(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}render()}
function choose(d){date=d;render()}
function writeNumber(){let v=document.getElementById('val').value;if(v===''||!Number.isFinite(+v))return alert('Please enter a number');if(item(current).type==='duration'&&+v<0)return alert('Duration cannot be negative');setrec(current,date,+v)}
function saveNote(){setrec(current,date,document.getElementById('note').value.trim()||null)}
function changeCount(n){setrec(current,date,Math.max(0,Number(rec(current,date)||0)+n))}
function addInterval(){let a=document.getElementById('from').value,b=document.getElementById('to').value;if(!a||!b||a===b)return alert('Please select two different times');let arr=rec(current,date)||[];setrec(current,date,[...arr,{start:a,end:b}])}
function removeInterval(i){let arr=[...(rec(current,date)||[])];arr.splice(i,1);setrec(current,date,arr)}
function clearEntry(){if(confirm('Clear this record?'))setrec(current,date,null)}
function graph(it){let vals=[];for(let i=13;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let v=rec(it.id,iso(d));vals.push({label:d.getDate(),v:it.type==='bool'?(v===true?1:0):it.type==='interval'?(Array.isArray(v)?v.reduce((a,x)=>a+minutes(x.start,x.end),0):0):Number(v)||0})}let max=Math.max(1,...vals.map(x=>x.v));if(it.type==='journal')return '';return '<div class="card"><div class="eyebrow">LAST 14 DAYS</div><h2>At a glance</h2><div class="chart">'+vals.map(x=>'<div title="'+x.v+'" class="bar '+(x.v?'':'zero')+'" style="height:'+Math.max(3,x.v/max*100)+'%"></div>').join('')+'</div><div style="display:flex;justify-content:space-between"><span class="barlabel">14 days ago</span><span class="barlabel">Today</span></div></div>'}
const KINDS={habit:['✅','Habit','Repeat a habit','bool'],measurement:['📊','Measurement','Numbers that fluctuate','number'],progress:['🌱','Progress','Build up toward completion','number'],target:['🎯','Target','Daily or weekly goals','number'],journal:['📝','Journal','Written daily notes','journal'],time:['🌙','Time Tracking','Record duration or sessions','interval']};
const KIND_FOR_TYPE={bool:'habit',counter:'habit',number:'measurement',duration:'time',interval:'time',journal:'journal'};
let selectedType='bool',selectedKind='habit';
function kindOf(it){return it.kind||KIND_FOR_TYPE[it.type]||'habit'}
function choices(k){return {habit:['bool','counter','duration'],measurement:['number'],progress:['number','counter'],target:['number','counter','duration'],journal:['journal'],time:['duration','interval']}[k]||['bool']}
function typeOptions(locked){return '<div class="type-grid">'+choices(selectedKind).map(t=>'<button type="button" '+(locked?'disabled':'')+' class="'+(selectedType===t?'chosen':'')+'" onclick="pickType(\''+t+'\')">'+TYPES[t][0]+' '+TYPES[t][1]+'<small>'+TYPES[t][2]+'</small></button>').join('')+'</div>'}
function goalOptions(it){return ['progress','target'].includes(selectedKind)?'<div class="row"><label class="field">Goal (optional)<input id="goal" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 100" value="'+escapeHtml(it?.goal??'')+'"></label><label class="field">Period<select id="period"><option value="total" '+((it?.period||'total')==='total'?'selected':'')+'>Overall</option><option value="day" '+(it?.period==='day'?'selected':'')+'>Daily</option><option value="week" '+(it?.period==='week'?'selected':'')+'>Weekly</option></select></label></div>':'<p class="muted">No target needed. Just record your life.</p>'}
function editor(isEdit){let it=isEdit?item(current):null;selectedKind=it?kindOf(it):'habit';selectedType=it?it.type:'bool';return '<button class="back" onclick="show(\''+(isEdit?'detail':'home')+'\')">← Back</button>'+head(isEdit?'Edit Tracker':'Add Tracker','Choose how you would like to track it. 🌷')+'<div class="card"><label class="field">Tracker name<input id="name" maxlength="45" placeholder="e.g. Weight, Reading, Sleep" value="'+escapeHtml(it?.name||'')+'"></label><div class="row"><label class="field">Icon<input id="emoji" maxlength="5" value="'+escapeHtml(it?.emoji||'🌼')+'"></label><label class="field">Unit (optional)<input id="unit" maxlength="18" placeholder="kg, pages…" value="'+escapeHtml(it?.unit||'')+'"></label></div><div class="field">1. Tracking type</div><div class="type-grid">'+Object.entries(KINDS).map(([k,v])=>'<button type="button" '+(isEdit?'disabled':'')+' id="kind-'+k+'" class="'+(selectedKind===k?'chosen':'')+'" onclick="pickKind(\''+k+'\')"><strong>'+v[0]+' '+v[1]+'</strong><small>'+v[2]+'</small></button>').join('')+'</div><div class="field">2. Entry method</div><div id="entry-options">'+typeOptions(isEdit)+'</div><div class="field">3. Goal</div><div id="goal-options">'+goalOptions(it)+'</div>'+(isEdit?'<p class="muted">Tracking type and entry method stay locked to preserve your history.</p>':'')+'<div style="margin-top:22px"><button class="primary" onclick="saveItem('+!!isEdit+')">'+(isEdit?'Save changes':'Create Tracker')+'</button></div>'+(isEdit?'<div style="margin-top:24px"><button class="danger" onclick="deleteItem()">Delete tracker and its records</button></div>':'')+'</div>'}
function pickKind(k){selectedKind=k;selectedType=KINDS[k][3];document.querySelectorAll('[id^="kind-"]').forEach(e=>e.classList.toggle('chosen',e.id==='kind-'+k));document.getElementById('entry-options').innerHTML=typeOptions(false);document.getElementById('goal-options').innerHTML=goalOptions(null)}
function pickType(t){selectedType=t;document.getElementById('entry-options').innerHTML=typeOptions(false)}
function saveItem(isEdit){let name=document.getElementById('name').value.trim(),emoji=document.getElementById('emoji').value.trim(),categoryId=document.getElementById('category').value,unit=document.getElementById('unit').value.trim();if(!name)return alert('Please enter a name');let g=document.getElementById('goal'),goal=g&&g.value!==''?Number(g.value):null,period=document.getElementById('period')?.value||'total';if(goal!=null&&(!Number.isFinite(goal)||goal<0))return alert('Invalid goal');if(isEdit)Object.assign(item(current),{name,emoji,unit,goal,period,categoryId});else{let x={id:uid(),name,emoji,unit,categoryId,type:selectedType,kind:selectedKind,goal,period};db.items.push(x);current=x.id}save();show('detail',current)}
function deleteItem(){if(!confirm('Permanently delete this tracker and all its records?'))return;db.items=db.items.filter(x=>x.id!==current);delete db.records[current];save();show('all')}
function palette(key,label){return '<div class="color-row"><h3>'+label+'</h3><p class="muted">Tap a color to apply instantly.</p><div class="swatches">'+COLORSETS[key].map(c=>'<button aria-label="'+label+' '+c+'" class="swatch '+((colors[key]||COLORSETS[key][0])===c?'selected':'')+'" style="background:'+c+'" onclick="chooseColor(\''+key+'\',\''+c+'\')"></button>').join('')+'</div></div>'}function settings(){return head('Your space, your rules.','WBB Life keeps your records on this device.')+'<div class="card"><h2>Make it yours 🎨</h2><p>Choose your colors. Saved automatically on this device.</p>'+palette('background','Background color')+palette('accent','Accent color')+'</div><div class="card"><h2>Your data belongs to you</h2><p>Your records are stored locally in this browser. They do not automatically sync across devices. Export a backup regularly, especially before clearing browser data.</p><div class="settingsActions"><button class="primary" onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById(\'import\').click()">Import backup</button></div><input type="file" class="hide" id="import" accept=".json,application/json" onchange="importData(event)"></div><div class="card"><h2>Made for everyday life 🌼</h2><p>Not every day needs a checkmark. Some things are simply worth noticing.</p><p class="muted">WBB Life · Version 1.1 · Offline-ready PWA</p></div>'}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wbb-life-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.items)||!obj.records||typeof obj.records!=='object')throw Error();if(!confirm('Replace all current data with this backup?'))return;db=obj;save();show('home')}catch{alert('Invalid backup file')}e.target.value=''}
function render(){navigation();el.innerHTML=page==='home'?home():page==='categories'?categoryManage():page==='all'?all():page==='detail'?detail():page==='new'?editor(false):page==='edit'?editor(true):settings();nav.style.display=['new','edit','detail'].includes(page)?'none':'flex'}
applyColors();render();
if('serviceWorker' in navigator){
  let initialController=Boolean(navigator.serviceWorker.controller);
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(initialController&&!refreshing){refreshing=true;window.location.reload()}
    initialController=true;
  });
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
    const check=()=>{if(navigator.onLine)reg.update().catch(()=>{})};
    check();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
    window.addEventListener('pageshow',check);
    setInterval(()=>{if(!document.hidden)check()},10*60*1000);
  }).catch(()=>{});
}
</script></body></html>
