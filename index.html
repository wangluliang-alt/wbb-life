 .things-list{display:grid;gap:12px}.things-tile{display:flex;align-items:center;gap:6px;border-radius:16px;padding:8px 12px;min-height:72px}.things-title{flex:1;text-align:left;font-size:20px;font-weight:650;background:transparent;border:0;color:#25313a}.things-move{background:transparent;border:0;font-size:18px;color:#55616b;padding:8px}.things-doc-row{display:flex;align-items:center;border-bottom:1px solid #ddd;padding:10px 0}.things-doc-row button:first-child{flex:1;text-align:left;font-size:18px}.things-doc-title{width:100%;font-size:24px;font-weight:650;margin-bottom:14px}.things-body{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6}.things-check{display:flex;gap:10px;align-items:center;margin:12px 0}.things-check input[type=text],.things-check input:not([type]){flex:1;min-width:0} </style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script></head><body><div id="app" class="shell"></div><nav id="nav" class="bottom"></nav><script>
const KEY='wbb-life-v1';
const TYPES={event:['','Date + optional note','Record an event when it happens'],bool:['✅','Yes / No','A simple daily check-in'],number:['⚖️','Number','Measurements like weight'],counter:['🔢','Counter','Tap +1 whenever it happens'],duration:['⏱️','Duration','Minutes or hours per day'],interval:['🌙','Time range','Start and end; multiple per day'],journal:['📝','Journal','Daily written notes']};
const starter=[['Weight','number','⚖️','kg'],['Reading','bool','📚',''],['Exercise','duration','🏃','min'],['Water','counter','💧','times'],['Sleep','interval','🌙','']];
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const today=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const initial=()=>({items:starter.map(x=>({id:uid(),name:x[0],type:x[1],emoji:x[2],unit:x[3]})),records:{}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(db.items)||!db.records)throw Error()}catch{db=initial()}
const COLORSETS={background:['#ffffff','#e8eaf2','#fff0c8','#ffdce9','#d2f2df','#d7edff','#e9dcff','#ffe0d2','#fff3ad','#d0f3ef'],accent:['#ff5677','#4be2d1','#8eafff','#d68ce9','#ff70af','#ffdb48','#55aa50','#8587d9','#ff9457','#33a7e8']};let colors;try{colors=JSON.parse(localStorage.getItem('wbb-life-colors'))||{}}catch{colors={}};const COLOR_KEY_V2='wbb-life-color-palette-v2';if(!localStorage.getItem(COLOR_KEY_V2)){colors={background:'#ffffff',accent:'#ec5a92',calendar:'#ffdce9',button:'#e95400'};localStorage.setItem('wbb-life-colors',JSON.stringify(colors));localStorage.setItem(COLOR_KEY_V2,'1')}function validHex(c){return typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c)}function optionBorder(hex){let n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return '#'+[r,g,b].map(x=>Math.max(0,Math.round(x*.67)).toString(16).padStart(2,'0')).join('')}function applyColors(){let bg=validHex(colors.background)?colors.background:'#ffffff',ac=validHex(colors.accent)?colors.accent:'#ec5a92';document.documentElement.style.background=bg;document.documentElement.style.setProperty('--app-background',bg);document.documentElement.style.setProperty('--app-accent',ac);document.documentElement.style.setProperty('--calendar-background',validHex(colors.calendar)?colors.calendar:'#ffdce9');document.documentElement.style.setProperty('--button-color',validHex(colors.button)?colors.button:'#e95400');let opt=validHex(colors.optionCard)?colors.optionCard:'#f2f3ed',selected=validHex(colors.selectedOption)?colors.selectedOption:'#dcece0';document.documentElement.style.setProperty('--option-card-color',opt);document.documentElement.style.setProperty('--selected-option-color',selected);document.documentElement.style.setProperty('--selected-option-border',validHex(colors.selectedOption)?optionBorder(selected):'#5c9876');document.querySelector('meta[name="theme-color"]').content=bg}function chooseColor(key,color){if(!validHex(color))return;colors[key]=color;localStorage.setItem('wbb-life-colors',JSON.stringify(colors));applyColors();render()}let page='notes',current=null,date=today(),month=new Date().getMonth(),year=new Date().getFullYear(),editing=null;
const el=document.getElementById('app'),nav=document.getElementById('nav');
let cloud=null,cloudUser=null,cloudBusy=false,cloudTimer=null,cloudStatus='Not signed in',cloudDirty=0;
const save=()=>{cloudDirty++;localStorage.setItem(KEY,JSON.stringify(db));cloudChanged()};
const CAT_KEY='wbb-life-category-ui-v1';
const defaultCategories=['Health','Learning','Lifestyle','Personal'];
if(!Array.isArray(db.categories)){db.categories=defaultCategories.map(name=>({id:uid(),name}));}
// Empty categories are allowed.
function inferCategory(it){let n=it.name.toLowerCase();let category=/weight|sleep|exercise|health|walk|medic|blood/.test(n)?'Health':/read|learn|study|calculus|music|course/.test(n)?'Learning':/water|food|clean|home/.test(n)?'Lifestyle':'Personal';return db.categories.find(c=>c.name===category)?.id||db.categories[0]?.id||''}
db.items.forEach(it=>{if(!db.categories.some(c=>c.id===it.categoryId))it.categoryId=inferCategory(it)});
save();
let overviewOpen=false;let homeDate=today(),collapsed={};try{collapsed=JSON.parse(localStorage.getItem(CAT_KEY))||{}}catch{collapsed={}}
const CATEGORY_COLORS=['#ffdce9','#d2f2df','#d7edff','#fff0c8','#e9dcff','#ffe0d2','#d0f3ef','#fff3ad','#e8eaf2','#ffffff'];
function categoryOptions(selected){return (db.categories.length?db.categories:[{id:'',name:'Uncategorised'}]).map(c=>'<option value="'+escapeHtml(c.id)+'" '+(c.id===selected?'selected':'')+'>'+escapeHtml(c.name)+'</option>').join('')}
function toggleCategory(id){collapsed[id]=!collapsed[id];localStorage.setItem(CAT_KEY,JSON.stringify(collapsed));render()}
function categoryManage(){return '<button class="back" onclick="show(\'home\')">← Back</button><div class="card"><div id="category-color-panel"></div>'+db.categories.map((c,i)=>'<div class="category-manage-row"><strong>'+escapeHtml(c.name)+'</strong><button class="category-color-preview" style="background:'+escapeHtml(c.color||'#ffdce9')+'" onclick="colorCategory(\''+c.id+'\')" aria-label="Change category color"></button><button onclick="moveCategory(\''+c.id+'\',-1)" aria-label="Move up">↑</button><button onclick="moveCategory(\''+c.id+'\',1)" aria-label="Move down">↓</button><button onclick="renameCategory(\''+c.id+'\')">Edit</button><button onclick="removeCategory(\''+c.id+'\')">×</button></div>').join('')+'<button class="primary" style="margin-top:17px" onclick="addCategory()">+ Add category</button></div>'}
function addCategory(){let name=prompt('New category name');if(!name?.trim())return;db.categories.push({id:uid(),name:name.trim().slice(0,45)});save();render()}
function colorCategory(id){let c=db.categories.find(c=>c.id===id);if(!c)return;let selected=c.color||'#ffdce9';let html='<div class="category-color-picker"><strong>Color for '+escapeHtml(c.name)+'</strong><div class="category-color-grid">'+CATEGORY_COLORS.map(color=>'<button aria-label="Select '+color+'" style="background:'+color+'" class="category-color-choice '+(selected===color?'selected':'')+'" onclick="setCategoryColor(\''+id+'\',\''+color+'\')"></button>').join('')+'</div><button class="secondary" onclick="render()">Done</button></div>';document.getElementById('category-color-panel').innerHTML=html}
function setCategoryColor(id,color){let c=db.categories.find(c=>c.id===id);if(!c||!validHex(color))return;c.color=color;save();if(page==='settings')render();else colorCategory(id)}
function renameCategory(id){let c=db.categories.find(c=>c.id===id);if(!c)return;let name=prompt('Category name',c.name);if(!name?.trim())return;c.name=name.trim().slice(0,45);save();render()}
function moveCategory(id,n){let i=db.categories.findIndex(c=>c.id===id),j=i+n;if(i<0||j<0||j>=db.categories.length)return;[db.categories[i],db.categories[j]]=[db.categories[j],db.categories[i]];save();render()}
function removeCategory(id){let c=db.categories.find(x=>x.id===id);if(!confirm('Delete category "'+c.name+'"? Its trackers and records will be kept and moved to another category.'))return;db.deletedCategories ||= [];if(!db.deletedCategories.includes(id))db.deletedCategories.push(id);db.categories=db.categories.filter(x=>x.id!==id);db.items.filter(x=>x.categoryId===id).forEach(x=>x.categoryId=db.categories[0]?.id||'');save();render()}
function startOfWeek(d){let a=new Date(d+'T12:00:00');a.setDate(a.getDate()-(a.getDay()+6)%7);return a}
function shiftWeek(n){let d=startOfWeek(homeDate);d.setDate(d.getDate()+n*7);homeDate=iso(d);render()}
function pickHomeDate(d){homeDate=d;render()}
function openHomeTracker(id){current=id;date=homeDate;let dt=new Date(date+'T12:00:00');month=dt.getMonth();year=dt.getFullYear();page='detail';render();window.scrollTo(0,0)}
function homeWeek(){let start=startOfWeek(homeDate),label=new Date(homeDate+'T12:00:00').toLocaleDateString('en-SG',{month:'long',year:'numeric'});let cells=Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);let key=iso(d);return '<button class="week-cell '+(key===homeDate?'selected ':'')+'" onclick="pickHomeDate(\''+key+'\')"><small>'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]+'</small><strong>'+d.getDate()+'</strong></button>'}).join('');return '<div class="week-card"><div class="week-controls"><button onclick="shiftWeek(-1)">‹</button><span>'+label+'</span><button onclick="shiftWeek(1)">›</button></div><div class="week-grid">'+cells+'</div></div>'}
function toggleOverview(){overviewOpen=!overviewOpen;render()}
function dashboard(){let n=db.items.filter(it=>it.type!=='event'&&rec(it.id,homeDate)!=null).length,dt=new Date(homeDate+'T12:00:00'),dateLabel=dt.toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short',year:'numeric'}),pct=db.items.filter(it=>it.type!=='event').length?Math.round(100*n/db.items.filter(it=>it.type!=='event').length):0;let h='<div class="compact-search"><button onclick="show(\'search\')" aria-label="Search">⌕</button></div>'+homeWeek()+'<div class="manage-categories"><strong>My life</strong><button onclick="show(\'categories\')">Manage categories ⚙</button></div>';for(let c of [...db.categories,...(db.items.some(it=>!db.categories.some(c=>c.id===it.categoryId))?[{id:'',name:'Uncategorised',color:'#e9eaf2'}]:[])]){let its=db.items.filter(it=>it.categoryId===c.id),done=its.filter(it=>it.type!=='event'&&rec(it.id,homeDate)!=null).length,isClosed=!!collapsed[c.id];h+='<div class="category-box"><button class="category-header" style="background:'+escapeHtml(c.color||CATEGORY_COLORS[db.categories.indexOf(c)%CATEGORY_COLORS.length])+'" onclick="toggleCategory(\''+c.id+'\')"><strong>'+escapeHtml(c.name)+'</strong><span>'+done+' / '+its.filter(it=>it.type!=='event').length+'</span><span class="chevron">'+(isClosed?'⌄':'⌃')+'</span></button>';if(!isClosed){h+='<div class="category-rows">'+(its.length?its.map(it=>{let v=rec(it.id,homeDate),missing=it.type==='event'?false:v==null||v===''||Array.isArray(v)&&!v.length;return '<button class="tracker-line" onclick="openHomeTracker(\''+it.id+'\')"><span class="tracker-name">'+escapeHtml(it.name)+'</span><span class="tracker-value '+(missing?'missing':'')+'">'+escapeHtml(summary(it,homeDate))+'</span><span class="tracker-go">'+(missing?'＋':'›')+'</span></button>'}).join(''):'<div class="category-empty">No trackers in this category yet.</div>')+'</div>'}h+='</div>'}
h+='<button class="add-tracker-wide" onclick="show(\'new\')">＋ Add Tracker</button>';return h}
const item=id=>db.items.find(x=>x.id===id);
const rec=(id,d)=>db.records[id]?.[d];
const setrec=(id,d,v)=>{if(!db.records[id])db.records[id]={};if(v===null||v===''||Array.isArray(v)&&!v.length)delete db.records[id][d];else db.records[id][d]=v;save();render()};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const head=(title,sub)=>'<div class="eyebrow">WBB LIFE · 王比比生活</div><h1>'+title+'</h1><p class="sub">'+sub+'</p>';
function summary(it,d=today()){if(it.type==='event')return (db.events?.[it.id]||[]).some(x=>x.date===d)?'Event recorded':'View history';let v=rec(it.id,d);if(v==null||v===''||Array.isArray(v)&&!v.length)return 'Not recorded';if(it.type==='bool')return v?'✓ Done':'Not yet';if(it.type==='interval'){let m=v.reduce((s,x)=>s+minutes(x.start,x.end),0);return fmt(m)}if(it.type==='duration')return fmt(+v);if(it.type==='journal')return String(v).slice(0,28)+(String(v).length>28?'…':'');return v+(it.unit?' '+it.unit:'')}
const fmt=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+(m%60?m%60+'m':''):m+'m'};
function minutes(a,b){if(!a||!b)return 0;let p=a.split(':').map(Number),q=b.split(':').map(Number),n=q[0]*60+q[1]-p[0]*60-p[1];return n<0?n+1440:n}
function show(pageName,id){page=pageName;if(id)current=id;if(pageName!=='detail'){date=today();month=new Date().getMonth();year=new Date().getFullYear()}render();window.scrollTo(0,0)}
function navigation(){nav.innerHTML=[['notes','☷','Do'],['things','≡','Things'],['home','⌂','Trackers'],['settings','⚙','Settings']].map(([k,ic,s])=>'<button class="'+(page===k?'active':'')+'" onclick="show(\''+k+'\')"><span>'+ic+'</span>'+s+'</button>').join('')}

// Things: plain-text collections and reusable notes, kept inside the existing cloud snapshot.
let thingsSection=null,thingsDoc=null;
function thingsInit(){if(!Array.isArray(db.thingsSections)){db.thingsSections=['Shopping','Trading','Projects','Dots','Books'].map(name=>({id:uid(),name,docs:[],updatedAt:Date.now()}));save()}}
function thingsSave(){save();render()}
function thingsTouch(){db.thingsUpdatedAt=Date.now()}

function thingsHome(){thingsInit();return '<div class="section"><h2>Things</h2><button class="pill" onclick="thingsAddSection()">+ Add</button></div><div class="things-list">'+db.thingsSections.map((c,i)=>'<div class="things-tile" style="background:'+['#ffdce9','#d2f2df','#d7edff','#fff0c8','#e9dcff'][i%5]+'"><button class="things-title" onclick="thingsOpenSection(\''+c.id+'\')">'+escapeHtml(c.name)+'</button><button class="things-move" onclick="thingsMoveSection(\''+c.id+'\',-1)" aria-label="Move up">↑</button><button class="things-move" onclick="thingsMoveSection(\''+c.id+'\',1)" aria-label="Move down">↓</button><button class="things-move" onclick="thingsRenameSection(\''+c.id+'\')" aria-label="Rename">···</button></div>').join('')+'</div>'}
function thingsFindSection(){return (db.thingsSections||[]).find(x=>x.id===thingsSection)}
function thingsAddSection(){thingsInit();let name=prompt('New section');if(!name?.trim())return;db.thingsSections.push({id:uid(),name:name.trim(),docs:[],updatedAt:Date.now()});thingsTouch();thingsSave()}
function thingsOpenSection(id){thingsSection=id;page='things-section';render();window.scrollTo(0,0)}
function thingsMoveSection(id,step){let a=db.thingsSections,i=a.findIndex(x=>x.id===id),j=i+step;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];thingsTouch();save();render()}
function thingsRenameSection(id){let c=db.thingsSections.find(x=>x.id===id);if(!c)return;let name=prompt('Rename or leave blank to delete',c.name);if(name===null)return;if(!name.trim()){if(confirm('Delete this section and its notes?')){db.deletedThingsSections=[...new Set([...(db.deletedThingsSections||[]),id])];db.thingsSections=db.thingsSections.filter(x=>x.id!==id);thingsTouch();thingsSave()}return}c.name=name.trim();c.updatedAt=Date.now();thingsTouch();thingsSave()}
function thingsSectionPage(){let c=thingsFindSection();if(!c)return thingsHome();return '<div class="section"><button class="back" onclick="show(\'things\')">← Things</button><button class="pill" onclick="thingsAddDoc()">+ Note</button></div><h2 style="margin:12px 0 20px">'+escapeHtml(c.name)+'</h2>'+(c.docs||[]).map((d,i)=>'<div class="things-doc-row"><button onclick="thingsOpenDoc(\''+d.id+'\')">'+escapeHtml(d.title)+'</button><button onclick="thingsMoveDoc(\''+d.id+'\',-1)">↑</button><button onclick="thingsMoveDoc(\''+d.id+'\',1)">↓</button></div>').join('')}
function thingsAddDoc(){let c=thingsFindSection();if(!c)return;let title=prompt('Note title');if(!title?.trim())return;let d={id:uid(),title:title.trim(),body:'',checks:[],updatedAt:Date.now()};c.docs.push(d);save();thingsOpenDoc(d.id)}
function thingsFindDoc(){return thingsFindSection()?.docs?.find(x=>x.id===thingsDoc)}
function thingsOpenDoc(id){thingsDoc=id;page='things-doc';render();window.scrollTo(0,0)}
function thingsDocPage(){let d=thingsFindDoc();if(!d)return thingsSectionPage();return '<button class="back" onclick="thingsOpenSection(\''+thingsSection+'\')">← '+escapeHtml(thingsFindSection().name)+'</button><div class="card"><input class="things-doc-title" aria-label="Title" value="'+escapeHtml(d.title)+'" onchange="thingsEditTitle(this.value)"><textarea class="things-body" placeholder="Write notes, paste links or ideas…" oninput="thingsEditBody(this.value)">'+escapeHtml(d.body||'')+'</textarea><div class="section"><h2>Checklist</h2><button class="pill" onclick="thingsAddCheck()">+ Item</button></div>'+(d.checks||[]).map(x=>'<div class="things-check"><input type="checkbox" '+(x.done?'checked':'')+' onchange="thingsCheck(\''+x.id+'\',this.checked)"><input value="'+escapeHtml(x.text)+'" oninput="thingsCheckText(\''+x.id+'\',this.value)"><button onclick="thingsRemoveCheck(\''+x.id+'\')">×</button></div>').join('')+'<button class="secondary" style="margin-top:20px" onclick="thingsDeleteDoc()">Delete note</button></div>'}
function thingsEditTitle(v){let d=thingsFindDoc();if(d){d.title=v;d.updatedAt=Date.now();save()}}
function thingsEditBody(v){let d=thingsFindDoc();if(d){d.body=v;d.updatedAt=Date.now();save()}}
function thingsAddCheck(){let d=thingsFindDoc();d.checks.push({id:uid(),text:'',done:false});d.updatedAt=Date.now();thingsSave()}
function thingsCheck(id,done){let d=thingsFindDoc(),x=d?.checks.find(x=>x.id===id);if(x){x.done=done;d.updatedAt=Date.now();save()}}
function thingsCheckText(id,text){let d=thingsFindDoc(),x=d?.checks.find(x=>x.id===id);if(x){x.text=text;d.updatedAt=Date.now();save()}}
function thingsRemoveCheck(id){let d=thingsFindDoc();d.checks=d.checks.filter(x=>x.id!==id);d.updatedAt=Date.now();thingsSave()}
function thingsMoveDoc(id,n){let c=thingsFindSection(),i=c.docs.findIndex(x=>x.id===id),j=i+n;if(j<0||j>=c.docs.length)return;[c.docs[i],c.docs[j]]=[c.docs[j],c.docs[i]];c.docs[i].updatedAt=Date.now();c.docs[j].updatedAt=Date.now();thingsSave()}
function thingsDeleteDoc(){if(!confirm('Delete this note?'))return;let c=thingsFindSection();c.docs=c.docs.filter(x=>x.id!==thingsDoc);save();thingsOpenSection(c.id)}

function tiles(){return '<div class="grid-cards">'+db.items.map(it=>'<button class="track" onclick="show(\'detail\',\''+it.id+'\')"><span class="grow"><strong>'+escapeHtml(it.name)+'</strong><small>'+(KINDS[kindOf(it)]?.[1]||TYPES[it.type][1])+'</small></span><span class="value">'+escapeHtml(summary(it))+' ›</span></button>').join('')+'</div>'}
function legacyHome(){let n=db.items.filter(x=>rec(x.id,today())!=null).length;return head('A little life, every day.','Your personal space to notice the little things. 🌿')+'<div class="card hero"><div class="flower">🌼</div><div class="eyebrow">TODAY · '+new Date().toLocaleDateString('en-SG',{weekday:'long',month:'long',day:'numeric'})+'</div><p style="margin:17px 0 5px"><strong>Make today yours.</strong></p><div class="muted">'+n+' of '+db.items.length+' trackers recorded today</div></div><div class="section"><h2>Your trackers</h2><button class="pill" onclick="show(\'new\')">+ Add</button></div>'+tiles()+(db.items.length?'':'<div class="card empty-state">Create your first tracker 🌸</div>')}
function home(){return dashboard()}
function all(){return head('Your little collection','Everything you choose to keep track of, in one place.')+'<div class="section"><h2>All trackers</h2><button class="pill" onclick="show(\'new\')">+ New</button></div>'+tiles()}
function calendar(it){let offset=(new Date(year,month,1).getDay()+6)%7,max=new Date(year,month+1,0).getDate();let s='<div class="calendarHead"><button onclick="shift(-1)">‹</button><strong>'+new Date(year,month).toLocaleDateString('en-SG',{month:'long',year:'numeric'})+'</strong><button onclick="shift(1)">›</button></div><div class="calendar">'+['M','T','W','T','F','S','S'].map(x=>'<div class="dayname">'+x+'</div>').join('');for(let i=0;i<offset;i++)s+='<div class="day empty"></div>';for(let i=1;i<=max;i++){let d=iso(new Date(year,month,i)),v=rec(it.id,d);s+='<button class="day '+(d===date?'selected ': '')+(v!=null?'has':'')+'" onclick="choose(\''+d+'\')">'+i+(v!=null?'<small>'+escapeHtml(it.type==='bool'?(v?'✓':'—'):it.type==='interval'?fmt(v.reduce((a,x)=>a+minutes(x.start,x.end),0)):it.type==='duration'?fmt(v):v)+'</small>':'')+'</button>'}return s+'</div>'}
function detail(){let it=item(current);if(!it){show('home');return ''}if(it.type==='event')return eventDetail(it);let v=rec(it.id,date),form='';
if(it.type==='bool')form='<div class="choice"><button class="'+(v===true?'chosen':'')+'" onclick="setrec(\''+it.id+'\',date,true)">✓ Yes, done!</button><button class="'+(v===false?'chosen':'')+'" onclick="setrec(\''+it.id+'\',date,false)">Not today</button></div>';
if(it.type==='number')form='<label class="field">Value '+escapeHtml(it.unit||'')+'<input id="val" type="number" step="any" inputmode="decimal" value="'+escapeHtml(v??'')+'" placeholder="Enter a number"></label><button class="primary" onclick="writeNumber()">Save entry</button>';
if(it.type==='counter')form='<div class="counter"><button onclick="changeCount(-1)">−</button><strong>'+Number(v||0)+'</strong><button onclick="changeCount(1)">+</button></div><p style="text-align:center">Each tap adds one '+escapeHtml(it.unit||'count')+'.</p>';
if(it.type==='duration')form='<label class="field">Minutes<input id="val" type="number" step="1" min="0" inputmode="numeric" value="'+escapeHtml(v??'')+'" placeholder="e.g. 20"></label><button class="primary" onclick="writeNumber()">Save duration</button>';
if(it.type==='journal')form='<label class="field">Your note<textarea id="note" rows="6" maxlength="5000">'+escapeHtml(v||'')+'</textarea></label><button class="primary" onclick="saveNote()">Save note</button>';
if(it.type==='interval'){form='<p class="muted">Add each sleep session, including naps. Overnight time ranges are supported.</p>'+(Array.isArray(v)?v:[]).map((x,i)=>'<div class="entry"><span>'+escapeHtml(x.start)+' → '+escapeHtml(x.end)+' · '+fmt(minutes(x.start,x.end))+'</span><button onclick="removeInterval('+i+')">Remove</button></div>').join('')+'<div class="row"><label class="field">From<input type="time" id="from" value="23:00"></label><label class="field">To<input type="time" id="to" value="07:00"></label></div><button class="primary" onclick="addInterval()">+ Add time range</button>'}
let goalInfo='';if(it.kind==='progress'){let total=Object.values(db.records[it.id]||{}).reduce((sum,x)=>sum+(Number(x)||0),0);goalInfo='<div class="card"><strong>Overall progress: '+total+' '+escapeHtml(it.unit||'')+(it.goal?' / '+escapeHtml(it.goal):'')+'</strong></div>'}else if(it.kind==='target'&&it.goal){let entries=db.records[it.id]||{},todayValue=Number(entries[date])||0,weekValue=Object.entries(entries).filter(([d])=>{let a=new Date(d+'T12:00:00'),b=new Date(date+'T12:00:00');let diff=Math.round((b-a)/86400000),dow=(b.getDay()+6)%7;return diff>=0&&diff<=dow}).reduce((sum,[d,v])=>sum+(Number(v)||0),0);let progress=it.period==='week'?weekValue:it.period==='total'?Object.values(entries).reduce((sum,v)=>sum+(Number(v)||0),0):todayValue;goalInfo='<div class="card"><strong>Goal: '+progress+' / '+escapeHtml(it.goal)+' '+escapeHtml(it.unit||'')+' ('+escapeHtml(it.period||'day')+')</strong></div>'};return '<button class="back" onclick="show(\'home\')">← Back to today</button><div class="heading"><div><div class="eyebrow">'+TYPES[it.type][1]+'</div><h1>'+escapeHtml(it.name)+'</h1></div><button class="secondary" onclick="show(\'edit\',\''+it.id+'\')">Edit / Delete</button></div><p class="sub">Your records, one day at a time.</p>'+goalInfo+'<div class="card"><div class="dateTitle">'+new Date(date+'T12:00:00').toLocaleDateString('en-SG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div><h2>'+escapeHtml(summary(it,date))+'</h2>'+form+(v!=null?'<div style="margin-top:18px"><button class="secondary" onclick="clearEntry()">Clear this day</button></div>':'')+'</div>'+graph(it)}
function shift(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}render()}
function choose(d){date=d;render()}
function writeNumber(){let v=document.getElementById('val').value;if(v===''||!Number.isFinite(+v))return alert('Please enter a number');if(item(current).type==='duration'&&+v<0)return alert('Duration cannot be negative');setrec(current,date,+v)}
function saveNote(){setrec(current,date,document.getElementById('note').value.trim()||null)}
function changeCount(n){setrec(current,date,Math.max(0,Number(rec(current,date)||0)+n))}
function addInterval(){let a=document.getElementById('from').value,b=document.getElementById('to').value;if(!a||!b||a===b)return alert('Please select two different times');let arr=rec(current,date)||[];setrec(current,date,[...arr,{start:a,end:b}])}
function removeInterval(i){let arr=[...(rec(current,date)||[])];arr.splice(i,1);setrec(current,date,arr)}
function clearEntry(){if(confirm('Clear this record?'))setrec(current,date,null)}
function graph(it){
 if(it.type==='journal')return '';
 const end=new Date(date+'T12:00:00'),values=[];
 for(let i=13;i>=0;i--){
  const d=new Date(end);d.setDate(end.getDate()-i);const key=iso(d),raw=rec(it.id,key);
  let value=null;
  if(raw!==null&&raw!==undefined&&raw!==''){
   if(it.type==='bool')value=raw===true?1:0;
   else if(it.type==='interval')value=Array.isArray(raw)?raw.reduce((sum,x)=>sum+minutes(x.start,x.end),0)/60:null;
   else if(it.type==='duration')value=Number(raw)/60;
   else value=Number(raw);
   if(!Number.isFinite(value))value=null;
  }
  values.push({key,label:d.getDate(),value});
 }
 const recorded=values.filter(x=>x.value!==null);
 const min=recorded.length?Math.min(...recorded.map(x=>x.value)):0,max=recorded.length?Math.max(...recorded.map(x=>x.value)):1;
 const pad=(max-min)*0.18||Math.max(Math.abs(max)*0.08,1),lo=min-pad,hi=max+pad;
 const x=i=>36+i*(304/13),y=v=>162-(v-lo)/(hi-lo)*132;
 let segments=[],currentSegment=[];
 values.forEach((p,i)=>{if(p.value===null){if(currentSegment.length>1)segments.push(currentSegment);currentSegment=[]}else currentSegment.push([x(i),y(p.value)])});
 if(currentSegment.length>1)segments.push(currentSegment);
 const paths=segments.map(points=>'<polyline points="'+points.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="var(--app-accent,#ec5a92)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>').join('');
 const dots=values.map((p,i)=>p.value===null?'':'<circle cx="'+x(i)+'" cy="'+y(p.value)+'" r="'+(p.key===date?6:4.5)+'" fill="var(--app-accent,#ec5a92)" stroke="#fff" stroke-width="2"><title>'+p.key+': '+escapeHtml(summary(it,p.key))+'</title></circle>').join('');
 const labels=values.map((p,i)=>'<text x="'+x(i)+'" y="188" text-anchor="middle" font-size="9" fill="#687585">'+p.label+'</text>').join('');
 const overlay=values.map((p,i)=>'<rect x="'+(x(i)-11)+'" y="16" width="22" height="180" fill="transparent" onclick="choose(\''+p.key+'\')"><title>'+p.key+(p.value===null?' · Not recorded':' · '+escapeHtml(summary(it,p.key)))+'</title></rect>').join('');
 const unit=it.type==='interval'||it.type==='duration'?'hours':it.type==='bool'?'done':it.unit||'';
 return '<div class="card trend-card"><div class="eyebrow">LAST 14 DAYS</div><h2>Trend</h2><p class="muted">Tap a date to view or edit its record.</p>'+(recorded.length?'<svg class="trend-svg" viewBox="0 0 380 210" role="img" aria-label="14-day trend chart"><line x1="36" y1="162" x2="340" y2="162" stroke="#e4e8e5"/><text x="32" y="32" text-anchor="end" font-size="10" fill="#687585">'+Number(hi).toFixed(1)+'</text><text x="32" y="163" text-anchor="end" font-size="10" fill="#687585">'+Number(lo).toFixed(1)+'</text>'+paths+dots+labels+overlay+'</svg>':'<p class="muted">No records in these 14 days yet.</p>')+'<p class="trend-unit">'+escapeHtml(unit)+'</p></div>';
}
const KINDS={event:['','Event Log','Record dates and optional notes','event'],habit:['✅','Habit','Repeat a habit','bool'],measurement:['📊','Measurement','Numbers that fluctuate','number'],progress:['🌱','Progress','Build up toward completion','number'],target:['🎯','Target','Daily or weekly goals','number'],journal:['📝','Journal','Written daily notes','journal'],time:['🌙','Time Tracking','Record duration or sessions','interval']};
const KIND_FOR_TYPE={event:'event',bool:'habit',counter:'habit',number:'measurement',duration:'time',interval:'time',journal:'journal'};
let selectedType='bool',selectedKind='habit';
function kindOf(it){return it.kind||KIND_FOR_TYPE[it.type]||'habit'}
function choices(k){return {event:['event'],habit:['bool','counter','duration'],measurement:['number'],progress:['number','counter'],target:['number','counter','duration'],journal:['journal'],time:['duration','interval']}[k]||['bool']}
function typeOptions(locked){return '<div class="type-grid">'+choices(selectedKind).map(t=>'<button type="button" '+(locked?'disabled':'')+' class="'+(selectedType===t?'chosen':'')+'" onclick="pickType(\''+t+'\')">'+TYPES[t][1]+'<small>'+TYPES[t][2]+'</small></button>').join('')+'</div>'}
function goalOptions(it){return ['progress','target'].includes(selectedKind)?'<div class="row"><label class="field">Goal (optional)<input id="goal" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 100" value="'+escapeHtml(it?.goal??'')+'"></label><label class="field">Period<select id="period"><option value="total" '+((it?.period||'total')==='total'?'selected':'')+'>Overall</option><option value="day" '+(it?.period==='day'?'selected':'')+'>Daily</option><option value="week" '+(it?.period==='week'?'selected':'')+'>Weekly</option></select></label></div>':'<p class="muted">No target needed. Just record your life.</p>'}
function editor(isEdit){let it=isEdit?item(current):null;selectedKind=it?kindOf(it):'habit';selectedType=it?it.type:'bool';return '<button class="back" onclick="show(\''+(isEdit?'detail':'home')+'\')">← Back</button>'+head(isEdit?'Edit Tracker':'Add Tracker','Choose how you would like to track it. 🌷')+'<div class="card"><label class="field">Tracker name<input id="name" maxlength="45" placeholder="e.g. Weight, Reading, Sleep" value="'+escapeHtml(it?.name||'')+'"></label><div class="row"><label class="field">Unit (optional)<input id="unit" maxlength="18" placeholder="kg, pages…" value="'+escapeHtml(it?.unit||'')+'"></label></div><label class="field">Category<select id="category">'+categoryOptions(it?.categoryId||db.categories[0]?.id||'')+'</select></label><div class="field">1. Tracking type</div><div class="type-grid">'+Object.entries(KINDS).map(([k,v])=>'<button type="button" '+(isEdit?'disabled':'')+' id="kind-'+k+'" class="'+(selectedKind===k?'chosen':'')+'" onclick="pickKind(\''+k+'\')"><strong>'+v[1]+'</strong><small>'+v[2]+'</small></button>').join('')+'</div><div class="field">2. Entry method</div><div id="entry-options">'+typeOptions(isEdit)+'</div><div class="field">3. Goal</div><div id="goal-options">'+goalOptions(it)+'</div>'+(isEdit?'<p class="muted">Tracking type and entry method stay locked to preserve your history.</p>':'')+'<div style="margin-top:22px"><button class="primary" onclick="saveItem('+!!isEdit+')">'+(isEdit?'Save changes':'Create Tracker')+'</button></div>'+(isEdit?'<div style="margin-top:24px"><button class="danger" onclick="deleteItem()">Delete tracker and its records</button></div>':'')+'</div>'}
function pickKind(k){selectedKind=k;selectedType=KINDS[k][3];document.querySelectorAll('[id^="kind-"]').forEach(e=>e.classList.toggle('chosen',e.id==='kind-'+k));document.getElementById('entry-options').innerHTML=typeOptions(false);document.getElementById('goal-options').innerHTML=goalOptions(null)}
function pickType(t){selectedType=t;document.getElementById('entry-options').innerHTML=typeOptions(false)}
function saveItem(isEdit){let name=document.getElementById('name').value.trim(),emoji='',categoryId=document.getElementById('category').value,unit=document.getElementById('unit').value.trim();if(!name)return alert('Please enter a name');let g=document.getElementById('goal'),goal=g&&g.value!==''?Number(g.value):null,period=document.getElementById('period')?.value||'total';if(goal!=null&&(!Number.isFinite(goal)||goal<0))return alert('Invalid goal');if(isEdit)Object.assign(item(current),{name,emoji,unit,goal,period,categoryId});else{let x={id:uid(),name,emoji,unit,categoryId,type:selectedType,kind:selectedKind,goal,period};db.items.push(x);current=x.id}save();show('detail',current)}
function deleteItem(){if(!confirm('Permanently delete this tracker and all its records?'))return;db.deletedItems ||= [];if(!db.deletedItems.includes(current))db.deletedItems.push(current);db.items=db.items.filter(x=>x.id!==current);delete db.records[current];if(db.events)delete db.events[current];save();show('home')}
function customColorInput(key){let color=validHex(colors[key])?colors[key]:'#ec5a92';return '<div class="custom-color-row"><label>Custom color</label><input type="color" value="'+color+'" onchange="chooseColor(\''+key+'\',this.value)"><span>'+color.toUpperCase()+'</span></div>'}
function palette(key,label){return '<div class="color-row"><h3>'+label+'</h3><p class="muted">Tap a color to apply instantly.</p><div class="swatches">'+(key==='background'||key==='calendar'||key==='optionCard'||key==='selectedOption'?COLORSETS.background:COLORSETS.accent).map(c=>'<button aria-label="'+label+' '+c+'" class="swatch '+((colors[key]||(key==='optionCard'?'#f2f3ed':key==='selectedOption'?'#dcece0':COLORSETS[key]?.[0]||'#ffffff'))===c?'selected':'')+'" style="background:'+c+'" onclick="chooseColor(\''+key+'\',\''+c+'\')"></button>').join('')+'</div>'+customColorInput(key)+'</div>'}function categorySettings(){return '<div class="card"><h2>Category colors</h2><p>Choose a color for each category.</p>'+db.categories.map(c=>'<div class="category-settings-item"><strong>'+escapeHtml(c.name)+'</strong><div class="category-settings-colors">'+CATEGORY_COLORS.map(color=>'<button type="button" aria-label="'+escapeHtml(c.name)+' '+color+'" class="category-settings-swatch '+((c.color||CATEGORY_COLORS[db.categories.indexOf(c)%CATEGORY_COLORS.length])===color?'selected':'')+'" style="background:'+color+'" onclick="setCategoryColor(\''+c.id+'\',\''+color+'\')"></button>').join('')+'</div><div class="custom-color-row"><label>Custom color</label><input type="color" value="'+(validHex(c.color)?c.color:'#ffdce9')+'" onchange="setCategoryColor(\''+c.id+'\',this.value)"></div></div>').join('')+'<button class="secondary" onclick="show(\'categories\')">Manage categories</button></div>'}
function appearancePanel(){let mode=localStorage.getItem('wbb-life-appearance')||'system';return '<div class="card"><h2>Appearance</h2><p>Choose how WBB Life looks.</p><div class="appearance-choices">'+['system','light','dark'].map(x=>'<button class="'+(mode===x?'selected':'')+'" onclick="setAppearance(\''+x+'\')">'+({system:'System',light:'Light',dark:'Dark'}[x])+'</button>').join('')+'</div></div>'}
function setAppearance(mode){localStorage.setItem('wbb-life-appearance',mode);applyAppearance();render()}
function applyAppearance(){let mode=localStorage.getItem('wbb-life-appearance')||'system',dark=mode==='dark'||mode==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark-mode',dark)}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyAppearance);
function settings(){return '<div class="card"><h2>Make it yours 🎨</h2><p>Choose your colors. Saved automatically on this device.</p>'+palette('background','Background color')+palette('calendar','Calendar color')+palette('accent','Accent color')+palette('button','Button color')+'<h3 style="margin-top:25px">Selection cards</h3>'+palette('optionCard','Option card color')+palette('selectedOption','Selected option color')+'</div>'+categorySettings()+appearancePanel()+'<div class="card"><h2>Your data belongs to you</h2><p>Your records are stored locally in this browser. When signed in, records sync to your private cloud account. Export a backup regularly.</p><div class="settingsActions"><button class="primary" onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById(\'import\').click()">Import backup</button></div><input type="file" class="hide" id="import" accept=".json,application/json" onchange="importData(event)"></div><div class="card"><h2>Reset Trackers</h2><p>Delete all trackers, categories and their history. Notes and To-Do are kept. Export a backup first if you might need the records later.</p><button class="secondary" onclick="resetTrackersAndCategories()">Reset Trackers & Categories</button></div><div class="card"><h2>Made for everyday life 🌼</h2><p>Not every day needs a checkmark. Some things are simply worth noticing.</p><p class="muted">WBB Life · Offline-ready PWA</p></div>'+cloudPanel()}
async function resetTrackersAndCategories(){
 if(!confirm('Permanently delete ALL trackers, categories and their history on every synced device? Notes and To-Do will stay. This cannot be undone.'))return;
 if(!confirm('Final confirmation: erase all Tracker history?'))return;
 if(cloudUser&&(cloudBusy||!navigator.onLine)){alert('Please wait for cloud sync to finish and make sure you are online before resetting.');return}
 let remote=null;
 if(cloudUser){try{const response=await cloudClient().from('life_snapshots').select('payload').eq('user_id',cloudUser.id).maybeSingle();if(response.error)throw response.error;remote=response.data?.payload||null}catch(e){alert('Cloud check failed. Nothing was deleted: '+e.message);return}}
 let previous=JSON.parse(JSON.stringify(db));
 let allItems=[...(db.items||[]),...(remote?.items||[])],allCats=[...(db.categories||[]),...(remote?.categories||[])];
 db.deletedItems=[...new Set([...(db.deletedItems||[]),...(remote?.deletedItems||[]),...allItems.map(x=>x.id)])];
 db.deletedCategories=[...new Set([...(db.deletedCategories||[]),...(remote?.deletedCategories||[]),...allCats.map(x=>x.id)])];
 db.items=[];db.categories=[];db.records={};
 if(remote){db=mergeLife(db,remote);db.items=[];db.categories=[];db.records={};}
 cloudDirty++;localStorage.setItem(KEY,JSON.stringify(db));
 if(cloudUser){try{cloudBusy=true;const result=await cloudClient().from('life_snapshots').upsert({user_id:cloudUser.id,payload:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(result.error)throw result.error;cloudStatus='Synced '+new Date().toLocaleTimeString()}catch(e){db=previous;localStorage.setItem(KEY,JSON.stringify(db));alert('Cloud reset failed; local data restored. '+e.message);cloudBusy=false;render();return}finally{cloudBusy=false}}
 render();alert('Trackers and categories cleared. Notes and To-Do kept.')
}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wbb-life-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.items)||!obj.records||typeof obj.records!=='object')throw Error();if(!confirm('Replace all current data with this backup?'))return;db=obj;save();show('home')}catch{alert('Invalid backup file')}e.target.value=''}

/* Daily Notes — separate from tracker records */
if(!db.notes||typeof db.notes!=='object')db.notes={};
let noteDate=today();
let noteFont=Number(localStorage.getItem('wbb-life-note-font'))||19;
noteFont=Math.min(30,Math.max(14,noteFont));
function noteRows(){return noteRowsFor(noteDate)}
function noteRowsFor(d){let rows=(Array.isArray(db.notes?.[d])?db.notes[d]:[]).filter(x=>!(db.deletedNotes||[]).includes(x.id));let generated=[];for(let rule of Object.values(db.recurringNotes||{})){if(!rule||!rule.text||!recurringDue(rule,d))continue;let id='repeat-'+rule.id+'-'+d;if(rows.some(x=>x.id===id)||(db.skippedRecurring||[]).includes(id))continue;generated.push({id,type:'check',text:rule.text,done:false,recurringId:rule.id})}return rows.concat(generated)}
function recurringDue(rule,d){if(d<rule.start||(rule.end&&d>rule.end))return false;let start=new Date(rule.start+'T12:00:00'),date=new Date(d+'T12:00:00');let days=Math.round((date-start)/86400000);if(days<0)return false;if(rule.freq==='daily')return true;if(rule.freq==='monthly')return date.getDate()===start.getDate();let week=Math.floor((days+((start.getDay()+6)%7))/7),day=date.getDay();return day===Number(rule.weekday)&&week%(rule.freq==='fortnightly'?2:1)===0}
function noteRowMutable(id){db.notes ||= {};db.notes[noteDate] ||= [];let row=db.notes[noteDate].find(x=>x.id===id);if(!row&&id.startsWith('repeat-')){let virtual=noteRowsFor(noteDate).find(x=>x.id===id);if(virtual){row={...virtual};db.notes[noteDate].push(row)}}return row}
function repeatEditor(id){let row=noteRows().find(x=>x.id===id);if(!row||row.type!=='check')return;let existing=row.recurringId?(db.recurringNotes||{})[row.recurringId]:null;let frequency=existing?.freq||'weekly',weekday=existing?.weekday??new Date(noteDate+'T12:00:00').getDay();let html='<div class="repeat-overlay" id="repeat-overlay"><div class="repeat-panel"><h2>Repeat to-do ↻</h2><p>'+escapeHtml(row.text||'To-do')+'</p><label>Repeat<select id="repeat-freq"><option value="daily">Every day</option><option value="weekly">Every week</option><option value="fortnightly">Every 2 weeks</option><option value="monthly">Every month</option></select></label><label>Day of week (for weekly repeats)<select id="repeat-weekday">'+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('')+'</select></label><label>End date (optional)<input type="date" id="repeat-end" value="'+(existing?.end||'')+'"></label><div class="repeat-actions"><button onclick="document.getElementById(\'repeat-overlay\').remove()">Cancel</button>'+(existing?'<button onclick="repeatStop(\''+existing.id+'\')">Stop repeating</button>':'')+'<button class="primary" onclick="repeatSave(\''+id+'\')">Save</button></div></div></div>';document.body.insertAdjacentHTML('beforeend',html);document.getElementById('repeat-freq').value=frequency;document.getElementById('repeat-weekday').value=weekday}
function repeatSave(id){let row=noteRows().find(x=>x.id===id),freq=document.getElementById('repeat-freq').value,weekday=Number(document.getElementById('repeat-weekday').value),end=document.getElementById('repeat-end').value;if(!row||!row.text.trim())return alert('Write the to-do first.');if(end&&end<noteDate)return alert('End date must not be before the start date.');db.recurringNotes ||= {};let ruleId=row.recurringId||uid(),old=db.recurringNotes[ruleId];db.recurringNotes[ruleId]={id:ruleId,text:row.text,start:old?.start||noteDate,freq,weekday,end};let actual=noteRowMutable(id);if(actual)actual.recurringId=ruleId;save();document.getElementById('repeat-overlay')?.remove();render()}
function repeatStop(ruleId){if(!confirm('Stop future repetitions? Existing entries will stay.'))return;delete db.recurringNotes[ruleId];save();document.getElementById('repeat-overlay')?.remove();render()}

let notePressTimer=null;

function searchUpdate(value){let q=value.trim().toLocaleLowerCase(),box=document.getElementById('search-results');if(!q){box.innerHTML='<p class="muted">Type something to search your records.</p>';return}let sections=[];let matches=db.items.filter(it=>it.name.toLocaleLowerCase().includes(q));if(matches.length)sections.push('<div class="card"><h2>Trackers & Event Logs</h2>'+matches.map(it=>'<button class="search-result" onclick="show(\'detail\',\''+it.id+'\')">'+escapeHtml(it.name)+' <small>'+escapeHtml(it.type==='event'?'Event Log':'Tracker')+'</small></button>').join('')+'</div>');let notes=[];for(let [d,rows] of Object.entries(db.notes||{})){if(!Array.isArray(rows))continue;for(let row of rows){if((row.text||'').toLocaleLowerCase().includes(q))notes.push({d,text:row.text})}}notes.sort((a,b)=>b.d.localeCompare(a.d));if(notes.length)sections.push('<div class="card"><h2>Daily Notes</h2>'+notes.slice(0,100).map(x=>'<button class="search-result" onclick="noteDate=\''+x.d+'\';show(\'notes\')">'+escapeHtml(x.text)+' <small>'+escapeHtml(x.d)+'</small></button>').join('')+'</div>');let events=[];for(let it of db.items.filter(x=>x.type==='event'))for(let e of eventList(it.id)){if((e.note||'').toLocaleLowerCase().includes(q)||e.date.includes(q))events.push({it,e})}events.sort((a,b)=>b.e.date.localeCompare(a.e.date));if(events.length)sections.push('<div class="card"><h2>Event History</h2>'+events.slice(0,100).map(x=>'<button class="search-result" onclick="show(\'detail\',\''+x.it.id+'\')">'+escapeHtml(x.it.name)+' · '+escapeHtml(x.e.note||x.e.date)+' <small>'+escapeHtml(x.e.date)+'</small></button>').join('')+'</div>');box.innerHTML=sections.join('')||'<p class="muted">No matches found.</p>'}
